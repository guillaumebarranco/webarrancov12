# ========== L&L Créations — admin Vendure ==========
<VirtualHost *:80>
    ServerName letladmin.webarranco.fr

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/letladmin.webarranco.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/letladmin.webarranco.fr-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName letl.webarranco.fr
    DocumentRoot /var/www/letl/apps/storefront-angular/dist/storefront-angular/browser

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/webarranco.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/webarranco.fr/privkey.pem

    # Proxy Shop API + assets vers Vendure (PM2, port 3010)
    ProxyPreserveHost On
    ProxyPass /shop-api http://127.0.0.1:3010/shop-api
    ProxyPassReverse /shop-api http://127.0.0.1:3010/shop-api
    ProxyPass /assets http://127.0.0.1:3010/assets
    ProxyPassReverse /assets http://127.0.0.1:3010/assets
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "letl.webarranco.fr"

    <FilesMatch "\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>

    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>

    <Directory /var/www/letl/apps/storefront-angular/dist/storefront-angular/browser>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /

        # Laisser Apache proxyer l'API et les assets
        RewriteCond %{REQUEST_URI} ^/shop-api [OR]
        RewriteCond %{REQUEST_URI} ^/assets [OR]
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/letl.webarranco.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/letl.webarranco.fr-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>

<VirtualHost *:443>
    ServerName letladmin.webarranco.fr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/webarranco.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/webarranco.fr/privkey.pem

    # Reverse proxy complet vers Vendure (dashboard + admin-api + assets)
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "letladmin.webarranco.fr"

    # WebSockets (dashboard / éventuels canaux temps réel)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3010/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/letladmin.webarranco.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/letladmin.webarranco.fr-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
